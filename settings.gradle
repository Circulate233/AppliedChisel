pluginManagement {
    repositories {
        gradlePluginPortal() {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
        mavenCentral()
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == 'net.neoforged.moddev') {
                useModule("io.github.ruixuqi:moddev-gradle:${requested.version}")
            }
        }
    }
}

buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
    }
    dependencies {
        classpath 'net.darkhax.curseforgegradle:CurseForgeGradle:1.3.33'
    }
}

plugins {
    // Automatic toolchain provisioning
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

gradle.beforeProject { project ->
    if (project.path == ':') {
        project.repositories.maven {
            name = 'NettyMavenCentral'
            url = 'https://repo.maven.apache.org/maven2'
            content {
                includeGroup 'io.netty'
            }
        }
        project.repositories.withType(MavenArtifactRepository).configureEach { repository ->
            if (repository.url.host == 'libraries.minecraft.net') {
                repository.content {
                    excludeGroup 'io.netty'
                }
            }
        }
    }
}

// Due to an IntelliJ bug, this has to be done
// rootProject.name = archives_base_name
rootProject.name = rootProject.projectDir.getName()
