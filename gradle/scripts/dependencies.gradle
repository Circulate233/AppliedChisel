apply from: 'gradle/scripts/helpers.gradle'

repositories {
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.FormlessDragon'
        }
    }
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
        content {
            includeGroup 'mezz'
            includeGroup 'team.chisel.ctm'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    modImplementation('com.github.FormlessDragon:Applied-Energistics-2-Supergiant:v1.1.0:dev') {
        transitive = false
    }
    modImplementation 'curse.maven:chisel-235279:2915375'
    modRuntimeOnly 'curse.maven:ctm-267602:2915363'
    modImplementation 'mezz:jei:4.35.0'
    modCompileOnly 'curse.maven:mouse-tweaks-unofficial-461660:5876158'

    compileOnlyApi 'org.jetbrains:annotations:24.1.0'
}
