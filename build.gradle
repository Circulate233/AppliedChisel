// It is advised to not edit this file directly, in order to update script easily.
// Instead, edit gradle/scripts/extra.gradle to customize the build.
import groovy.json.JsonOutput
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'net.neoforged.moddev.mcpforge' version '2.0.185-legacy'
    id 'com.diffplug.spotless' version '8.10.4' apply false
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

apply from: 'gradle/scripts/helpers.gradle'

private String gitOutput(List<String> args, String fallback) {
    try {
        def process = new ProcessBuilder(['git'] + args)
            .directory(rootProject.projectDir)
            .redirectErrorStream(true)
            .start()
        def stdout = process.inputStream.getText('UTF-8').trim()
        if (process.waitFor() == 0 && !stdout.isEmpty()) {
            return stdout
        }
    } catch (Exception ignored) {
        // Source archives and offline builds may not have Git available.
    }
    return fallback
}

private String defaultModVersion() {
    def previousTag = gitOutput(['describe', '--tags', '--abbrev=0', '--exclude=dev'], propertyString('mod_version'))
    if (previousTag.startsWith('v')) {
        previousTag = previousTag.substring(1)
    }
    def shortHash = gitOutput(['rev-parse', '--short', 'HEAD'], 'unknown')
    return "${previousTag}+${shortHash}"
}

if (!gradle.startParameter.projectProperties.containsKey('mod_version')) {
    project.setProperty('mod_version', defaultModVersion())
}

if (propertyBool('enable_shadow')) {
    apply plugin: 'com.gradleup.shadow'
}

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'

assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'use_mixins', 'mixin_configs'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'

setDefaultProperty 'generate_sources_jar', true, false
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'enable_shadow', false, false
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'extra_jvm_args', false, ''

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName = propertyString('mod_id')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    if (propertyBool('enable_shadow')) {
        shaded
        implementation.extendsFrom(shaded)
    }
}

boolean useMixins = propertyBool('use_mixins')
def mixinConfigs = propertyStringList('mixin_configs', ',')

String reobfTaskName = 'reobfJar'

if (propertyBool('enable_shadow')) {
    def reobfShadowJar = obfuscation.reobfuscate(tasks.named('shadowJar'), sourceSets.main)
    reobfTaskName = reobfShadowJar.name
    tasks.named('assemble').configure {
        dependsOn reobfShadowJar
    }
}

//noinspection GroovyAssignabilityCheck
mcpForge {
    if (propertyBool('use_access_transformer')) {
        accessTransformers.from(propertyStringList('access_transformer_locations').collect {
            "src/main/resources/${it}"
        })
    }

    enable {
        cleanroomVersion = '0.6.13-alpha'
        mcpMappings = 'de.oceanlabs.mcp:mcp_stable:39-1.12@zip'
        obfuscateJar = !propertyBool('enable_shadow')
    }

    runs {
        configureEach {
            programArguments.addAll('--username', propertyString('minecraft_username'))
            systemProperty('net.minecraftforge.gradle.GradleStart.srg.srg-mcp',
                    layout.buildDirectory.file('moddev/artifacts/intermediateToNamed.srg').get().asFile.absolutePath)
            def extraArgs = propertyString('extra_jvm_args')
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                extraArgs.trim().split(/\s+/).each { jvmArgument(it) }
            }
            if (propertyBool('enable_foundation_debug')) {
                systemProperty("foundation.dump", "true")
                systemProperty("foundation.verbose", "true")
            }
            if (propertyBool('is_coremod')) {
                systemProperty("fml.coreMods.load", propertyString('coremod_plugin_class_name'))
            }
        }
        client {
            client()
            disableIdeRun()
        }
        server {
            server()
            disableIdeRun()
            systemProperty 'fml.queryResult', 'confirm'
        }
    }

    mods {
        create(propertyString('mod_id')) {
            sourceSet(sourceSets.main)
        }
    }
}

def mixinRefmap = null
if (useMixins) {
    mixin {
        mixinConfigs.each { config(it) }
        String refmap = propertyString('mixin_refmap')
        if (!refmap.isBlank()) {
            mixinRefmap = add(refmap)
        }
    }
}

// Do not configure your deps here!
// Check gradle/scripts/dependencies.gradle for that.
dependencies {
    if (useMixins) {
        annotationProcessor 'com.cleanroommc:mixinextras-common:0.5.5'
        annotationProcessor 'com.cleanroommc:cleanmix:0.7.4'
    }
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

def generatedTagsSourceDir = layout.buildDirectory.dir('generated/sources/tags/java')
def generateTagsSource = tasks.register('generateTagsSource') {
    def tagsPackage = "${propertyString('root_package')}.${propertyString('mod_id')}"
    def outputFile = generatedTagsSourceDir.map {
        it.file("${tagsPackage.replace('.', '/')}/Tags.java")
    }

    inputs.property('root_package', propertyString('root_package'))
    inputs.property('mod_id', propertyString('mod_id'))
    inputs.property('mod_name', propertyString('mod_name'))
    inputs.property('mod_version', propertyString('mod_version'))
    outputs.file(outputFile)

    doLast {
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        file.text = """package ${tagsPackage};

public final class Tags {

    public static final String MOD_ID = "${propertyString('mod_id')}";
    public static final String MOD_NAME = "${propertyString('mod_name')}";
    public static final String VERSION = "${propertyString('mod_version')}";

    private Tags() {
    }
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir generatedTagsSourceDir
        }
    }
}

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
    def resourceProps = [
        mod_id               : propertyString('mod_id'),
        mod_name             : propertyString('mod_name'),
        mod_version          : propertyString('mod_version'),
        mod_description      : propertyString('mod_description'),
        mod_authors          : propertyStringList('mod_authors', ',').collect { it.strip() }.join('", "'),
        mod_credits          : propertyString('mod_credits'),
        mod_license          : propertyString('mod_license'),
        mod_url              : propertyString('mod_url'),
        mod_issue_tracker_url: propertyString('mod_issue_tracker_url'),
        mod_update_json      : propertyString('mod_update_json'),
        mod_icon_item        : propertyString('mod_icon_item'),
        mod_logo_path        : propertyString('mod_logo_path'),
        mod_icon_path        : propertyString('mod_icon_path'),
        mod_background_path  : propertyString('mod_background_path')
    ]
    inputs.properties(resourceProps)
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(resourceProps)
    }
}


compileJava {
    dependsOn(generateTagsSource)
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar').configure {
    dependsOn(generateTagsSource)
}

def modManifestAttributes = {
    def attribute_map = [:]
    attribute_map['ModType'] = "CRL"
    if (configurations.contain.size() > 0) {
        attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
        attribute_map['NonModDeps'] = true
    }
    if (propertyBool('is_coremod')) {
        attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
        if (propertyBool('coremod_includes_mod')) {
            attribute_map['FMLCorePluginContainsFMLMod'] = true
        }
    }
    if (propertyBool('use_access_transformer')) {
        attribute_map['FMLAT'] = propertyString('access_transformer_locations')
    }
    return attribute_map
}

jar {
    if (propertyBool('enable_shadow')) {
        archiveClassifier = 'plain'
    } else {
        archiveClassifier = 'dev'
        destinationDirectory = layout.buildDirectory.dir('libs')
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    if (configurations.contain.size() > 0) {
        into('/') {
            from configurations.contain
        }
    }
    doFirst {
        manifest {
            attributes(modManifestAttributes())
        }
    }
}

if (propertyBool('enable_shadow')) {
    // Shade deps to the dev jar, so the normal dev jar will contain deps
    shadowJar {
        archiveClassifier = 'dev'
        destinationDirectory = layout.buildDirectory.dir('libs')
        //noinspection GroovyAssignabilityCheck,GroovyAccessibility
        configurations = [ project.configurations.shaded ]
        // ShadowJar has its own `configurations` (the shaded ones), so the project's have to be qualified
        if (project.configurations.contain.size() > 0) {
            into('/') {
                from project.configurations.contain
            }
        }
        if (mixinRefmap != null) {
            // The shaded jar replaces `jar`, and reobfuscation remaps this jar, so the refmap has to be here
            from(mixinRefmap)
        }
        doFirst {
            manifest {
                attributes(modManifestAttributes())
            }
        }
    }
    // Unshaded dev jar get 'plain' as name
    tasks.named("jar").configure {
        finalizedBy shadowJar
    }
}

tasks.named(reobfTaskName).configure {
    // Convention from jar/shadowJar
    archiveClassifier = ''
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "0. Create Artifacts"(Gradle) {
                    taskNames = ["createMinecraftArtifacts"]
                }
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Build Mod"(Gradle) {
                    taskNames = ["build"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

plugins.withId('com.diffplug.spotless') {
    project.idea.project.settings.runConfigurations.create('4. Apply Spotless', Gradle) {
        taskNames = ['spotlessApply']
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.register('generateMixinJson') {
    group = 'build setup'
    description = 'Generates missing Mixin configuration JSON files.'
    onlyIf {
        useMixins
    }
    doLast {
        def missingConfigs = mixinConfigs.findAll { configName ->
            !file("src/main/resources/${configName}").exists()
        }
        if (missingConfigs.isEmpty()) {
            logger.lifecycle('No missing Mixin JSON files.')
            return
        }
        missingConfigs.each { configName ->
            def configFile = file("src/main/resources/${configName}")
            configFile.parentFile.mkdirs()
            def config = [
                    'package': '',
                    'refmap': propertyString('mixin_refmap'),
                    'required': true,
                    'target': '@env(DEFAULT)',
                    'minVersion': '0.8.7',
                    'compatibilityLevel': 'JAVA_25',
                    'mixins': [],
                    'server': [],
                    'client': [],
                    'setSourceFile': true
            ]
            configFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(config)) + '\n', 'UTF-8')
            logger.lifecycle("Generated Mixin JSON: ${configFile}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
